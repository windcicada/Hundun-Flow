name: Product release
on:
  push:
    tags: ['v1.1.0']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch verified release assets
        shell: bash
        run: |
          set -euo pipefail
          git init product
          cd product
          git remote add origin "https://github.com/$GH_REPO.git"
          git fetch --depth=1 origin "refs/tags/$RELEASE_TAG"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD > ../release-commit
          git fetch --depth=1 origin "refs/heads/release/$RELEASE_TAG"
          mkdir ../assets
          git archive FETCH_HEAD | tar -x -C ../assets
          cmp ../release-commit ../assets/COMMIT
          cd ../assets
          sha256sum --check SHA256SUMS
      - name: Publish complete release
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Hundun-Flow V1.1.0" --notes-file ../product/docs/release.md \
            ./*.tar.gz ./SHA256SUMS ./ACCEPTANCE.md ./LICENSES.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
          mkdir ../download
          gh release download "$RELEASE_TAG" --dir ../download
          cd ../download
          sha256sum --check SHA256SUMS
