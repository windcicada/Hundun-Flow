[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hundun-client"
version = "0.1.0"
description = "Independent simulation workbench and AI client"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md", "docs/licenses.txt"]
authors = [{name="WANG YUDONG", email="wangyudong@buaa.edu.cn"}]
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
 "pydantic>=2.12,<3", "platformdirs>=4,<5", "asyncssh>=2.20,<3",
 "keyring>=25,<26", "numpy>=2,<3", "matplotlib>=3.9,<4",
 "pyvista>=0.46,<0.50", "nanobot-ai==0.3.5", "mcp>=1.26,<2"
]
[project.scripts]
hundun-client = "app.cli:main"
[tool.setuptools]
packages = ["app"]
include-package-data = true
[tool.setuptools.package-data]
app = ["web/**/*", "web/*"]
