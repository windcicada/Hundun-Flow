description: Synthetic seven-species interface fixture with constant-cp NASA polynomials.
phases:
- name: kerosene
  thermo: ideal-gas
  elements: [O, H, C, N]
  species: [H2, H2O, CO, CO2, O2, N2, C12H23]
  kinetics: gas
  reactions: none
  transport: mixture-averaged
  hundun-chemistry: {model: kerosene_4_step_v1, interval: frozen_material}
  state: {T: 1200.0, P: 100000, Y: {O2: 0.23, N2: 0.77}}
species:
- name: H2
  composition: {H: 2}
  thermo:
    model: NASA7
    temperature-ranges: [200.0, 1000.0, 6000.0]
    data: [[3.5, 0, 0, 0, 0, 0, 1], [3.5, 0, 0, 0, 0, 0, 1]]
  transport: {model: gas, geometry: linear, diameter: 3.6, well-depth: 100.0, rotational-relaxation: 1.0}
- name: H2O
  composition: {H: 2, O: 1}
